name: MLOps CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Automated API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run automated tests
        env:
          MLFLOW_TRACKING_URI: ""
        run: |
          python -m pytest tests/test_api.py -v

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Version model artifact
        run: |
          echo "Model file: app/model/clasificador_vinos.joblib"
          echo "Git commit: ${{ github.sha }}"
          sha256sum app/model/clasificador_vinos.joblib

      - name: Build backend Docker image
        run: |
          docker build \
            --tag wine-quality-api:${{ github.sha }} \
            .

      - name: Verify Docker image
        run: |
          docker image inspect wine-quality-api:${{ github.sha }}

  simulated-deployment:
    name: Simulated Continuous Deployment
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Register simulated deployment
        run: |
          echo "Deployment validation completed successfully."
          echo "Commit deployed: ${{ github.sha }}"
          echo "Target environment: simulated-production"
          echo "Status: ready for deployment"